<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Figori</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <span class="brand" aria-label="Figori">ƒ<span>Figori</span></span>
      <div class="file-heading">
        <strong id="filename" aria-live="polite" aria-atomic="true"
          >Untitled</strong
        ><span id="save-status" role="status" hidden></span>
      </div>
      <nav aria-label="File actions">
        <button
          class="icon-button"
          id="new"
          aria-label="New worksheet"
          title="New worksheet (⌘N)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 5v14M5 12h14" />
          </svg></button
        ><button
          class="icon-button"
          id="open"
          aria-label="Open file"
          title="Open file (⌘O)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M3 7h6l2 2h10l-3 11H3V7zm0 0V4h7l2 3" />
          </svg></button
        ><button
          class="icon-button"
          id="save"
          aria-label="Save"
          title="Save (⌘S)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M5 3h12l4 4v14H3V3h2zm2 0v6h10V3M7 21v-8h10v8" />
          </svg></button
        ><button
          class="icon-button"
          id="save-as"
          aria-label="Save as"
          title="Save as (⌘⇧S)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M4 14v7h16v-7M12 3v13m-5-5 5 5 5-5" />
          </svg>
        </button>
        <button
          class="icon-button"
          id="appearance-button"
          aria-label="Appearance"
          title="Appearance"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M4 6h16M4 12h16M4 18h16M8 3v6m8 0v6m-7 0v6" />
          </svg>
        </button>
      </nav>
    </header>
    <div class="context">
      <button id="context-button" title="Date and timezone settings">
        Today</button
      ><label class="precision"
        >Decimals
        <select id="precision" aria-label="Decimal places">
          <option>0</option>
          <option>1</option>
          <option selected>2</option>
          <option>3</option>
          <option>4</option>
          <option>6</option>
        </select></label
      >
    </div>
    <div id="notice" role="status" hidden></div>
    <main id="editor" aria-label="Calculation worksheet">
      <div
        id="column-splitter"
        role="separator"
        tabindex="0"
        aria-label="Resize expression and result columns"
        aria-orientation="vertical"
        aria-controls="source-editor result-column"
        title="Drag to resize columns. Double-click to fit visible results. Arrow keys resize; Home/End use minimum/maximum width."
      >
        <span aria-hidden="true"></span>
      </div>
    </main>
    <footer>
      <span id="line-status">Type freely. Results appear beside each line.</span
      ><button id="rates" title="Refresh exchange rates">Exchange rates</button>
    </footer>
    <dialog id="settings" aria-label="Calculation context">
      <form id="settings-form">
        <h2>Calculation context</h2>
        <label
          >Date anchor<select id="anchor-mode">
            <option value="today">Today — follows the calendar</option>
            <option value="fixed">Pinned date</option>
          </select></label
        ><label id="date-label"
          >Pinned date<input id="anchor-date" type="date" /></label
        ><label
          >Timezone<input
            id="timezone"
            value="Asia/Jerusalem"
            required /></label
        ><label class="check"
          ><input id="partial" type="checkbox" />Include a trailing partial
          billing month</label
        >
        <div class="dialog-actions">
          <button type="button" id="settings-cancel">Cancel</button
          ><button type="submit" class="primary">Apply</button>
        </div>
      </form>
    </dialog>
    <dialog id="appearance" aria-labelledby="appearance-title">
      <form id="appearance-form">
        <h2 id="appearance-title">Appearance</h2>

        <label
          >Theme<select id="theme">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
            <option value="system">System</option>
          </select></label
        >
        <label
          >Worksheet font<select id="editor-font">
            <option value="nerd">JetBrains Mono · Nerd Font</option>
            <option value="system">System Mono</option>
          </select></label
        >
        <div class="appearance-grid">
          <label
            >Text size<select id="editor-size">
              <option value="12">12 px</option>
              <option value="14">14 px</option>
              <option value="16">16 px</option>
              <option value="18">18 px</option>
              <option value="20">20 px</option>
              <option value="22">22 px</option>
              <option value="24">24 px</option>
            </select></label
          >
          <label
            >Line spacing<select id="editor-spacing">
              <option value="1.4">1.4×</option>
              <option value="1.6">1.6×</option>
              <option value="1.9">1.9×</option>
              <option value="2.2">2.2×</option>
            </select></label
          >
        </div>
        <p class="font-preview" id="font-preview">
          rent × 12 <span><span class="currency-glyph">₪</span>12,600</span>
        </p>
        <div class="dialog-actions">
          <button type="button" id="appearance-cancel">Cancel</button
          ><button type="submit" class="primary">Apply</button>
        </div>
      </form>
    </dialog>
    <dialog id="details" aria-labelledby="detail-expression">
      <h2 id="detail-expression"></h2>
      <pre id="detail-result"></pre>
      <p id="detail-basis"></p>
      <div class="dialog-actions">
        <button id="detail-copy">Copy result</button
        ><button id="detail-close" class="primary">Done</button>
      </div>
    </dialog>
    <script type="module" src="main.js"></script>
  </body>
</html>
