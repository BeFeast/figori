[package]
name = "figori-desktop"
version = "0.3.2"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "figori_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
tauri = "=2.11.5"
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }

# Rust 1.96 / LLVM 22 stripping can misalign host proc-macro dylibs on macOS 27.
# Keep host build artifacts loadable without changing application deployment targets.
# https://github.com/rust-lang/rust/issues/157750
[profile.release.build-override]
strip = "none"
